# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "mambaforge-latest"
  jobs:
    create_environment:
      - mamba env create -p .env/ --file environment-files/readthedocs.yml
    build:
      html:
        - PATH=$(pwd)/.env/bin/:$PATH make autodoc
        # mystmd derives the base URL (/en/<version>) from READTHEDOCS_CANONICAL_URL
        # but doesn't seem to pass it as BASE_URL to book-theme v2 (released on 2026-11-10).
        # So, set BASE_URL to the same value here. If/when this is fixed in mystmd,
        # setting BASE_URL can be removed from this line (but it should also continue
        # to work as is).
        - BASE_URL=$(echo "$READTHEDOCS_CANONICAL_URL" | sed -E -e "s#^https?://[^/]+##" -e "s#/\$##") PATH=$(pwd)/.env/bin/:$PATH make html
        - mkdir -p $READTHEDOCS_OUTPUT
        - cp -a docs/_build/* $READTHEDOCS_OUTPUT/

conda:
  environment: environment-files/readthedocs.yml
